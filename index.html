<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,body{
            width: 100%;
            height: 100%;
        }

        #main{
            display: flex;
            height: 100%;
            width: 100%;
            background-color: #222;
            padding: 50px;
        }

        input{
            display: block;
            font-size: 25px;
            margin-bottom: 20px;
        }

        #btn {
            padding: 12px 22px;
            background-color: rgb(56, 202, 134);
            color: white;
            font-weight: 600;
            border-radius: 5px;

        }

        #btn:hover{
            background-color: rgb(36, 90, 65);
        }

        .card {
            max-width: 300px;
            color: white;
            margin-top: 40px;
            border-radius: 10px;
            display: inline-block;
            padding: 20px;
            border: 1px solid #555;
        }

        .profile {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 7px;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            overflow: hidden;
        }

        .card p {
            font-size: 12px;
            margin-top: 10px;
        }

        .card h5 {
            margin-top: 3px;
        }

    </style>
</head>
<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="profile picture">
            <input type="text" placeholder="name">
            <input type="text" placeholder="job">
            <input type="text" placeholder="info">
            <input type="submit">
        </form>
    </div>
    div


    <script src="script.js"></script>
</body>
</html>

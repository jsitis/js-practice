<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API</title>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body>
    <div id="root"></div>
</body>
</html>

<script type="text/babel">
    const {useState} = React;

    function App(){
        const [movies, setMovies] = useState([]);
        const [movieName, setMovieName] = useState("");

        async function fetchMovie() {
            try {
                const response = await fetch("https://reactmovie-8a415-default-rtdb.asia-southeast1.firebasedatabase.app/movies.json");
                const result = await response.json();

                const moviesArray = Object.entries(result).map(([id, movie]) => ({id, movie}))
                setMovies(moviesArray);
            }
            catch (error){
                console.log(error);
            }
        }

        async function addMovie() {
            if(!movieName) return alert("Please enter a movie name");
            
            try {
                const response = await fetch("https://reactmovie-8a415-default-rtdb.asia-southeast1.firebasedatabase.app/movies.json",{
                    method: "POST",
                    body: JSON.stringify ({name: movieName}),
                    headers: {"Content-Type": "application/json"},
                }
            );  
            } catch (error) {
            }
        }
        
        return(
            <>
                <h1>React API Example</h1>
                <button onClick = {fetchMovie}>Fetch Movies!!</button>
                <button onClick = {addMovie}>Add Movies!!</button>

                <input type="text" placeholder ="Enter Movie Name" value = {movieName} onChange={(e) => setMovieName(e.target.value)} />
                <ul>
                    {movies.map((movie, index)=> (
                        <>
                        <li key={item.id}>{movie.movie.name}</li>
                        </>
                    ))}   
                </ul>
            </>
        );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>)
</script>
